<!--
For multiple image targets in MindAR, you add one <a-entity> per target.

targetIndex values are:
- 0 = first image in targets.mind
- 1 = second image
- 2 = third image
- etc.
-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multiple Image Targets</title>

  <script src="aframe.min.js"></script>
  <script src="mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: multiple.mind;"
  vr-mode-ui="false"
  device-orientation-permission-ui="false">

  <a-camera position="0 0 0" look-controls="false"></a-camera>

  <!-- First target (index 0) -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-box
      position="0 0 0"
      color="#05baf1"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
    </a-box>
  </a-entity>

  <!-- Second target (index 1) -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-sphere
      position="0 0 0"
      radius="0.3"
      color="#ff4d6d"
      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">
    </a-sphere>
  </a-entity>

</a-scene>

</body>
</html>
